apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
    spec:
      containers:
        - name: registration-service
          image: registration-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5002
          env:
            - name: MONGODB_URI
              value: mongodb://mongo:27017/registrations_db
            - name: EVENT_SERVICE_URL
              value: http://event-service:5000
---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
spec:
  selector:
    app: registration-service
  ports:
    - port: 5002
      nodePort: 30502
  type: NodePort