services:
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  event-service:
    build: ./event-service
    container_name: event-service
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/eventdb 
    depends_on:
      - mongo

  registration-service:
    build: ./registration-service
    container_name: registration-service
    ports:
      - "5002:5002"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/registrations_db
      - EVENT_SERVICE_URL=http://event-service:5000
    depends_on:
      - mongo
      - event-service

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - event-service
      - registration-service

volumes:
  mongo_data: